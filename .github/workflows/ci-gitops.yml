name: GitOps Pipeline (Argo CD Sync)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1. TEST
  # ═══════════════════════════════════════════════════════════
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ═══════════════════════════════════════════════════════════
  # 2. BUILD & PUSH IMAGE TO ACR
  # ═══════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current ISO timestamp
        id: timestamp
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/eneisoft-demo:${{ github.sha }}
            ${{ vars.ACR_NAME }}.azurecr.io/eneisoft-demo:latest
          build-args: |
            APP_VERSION=1.0.0
            GIT_SHA=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_DATE=${{ steps.timestamp.outputs.date }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════
  # 3. GITOPS: UPDATE KUSTOMIZE MANIFEST VIA GIT COMMIT
  # ═══════════════════════════════════════════════════════════
  update-manifest:
    name: Commit Image Tag to Git (GitOps)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer git push al repositorio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Kustomize image tag
        run: |
          cd k8s
          IMAGE_TAG="${{ vars.ACR_NAME }}.azurecr.io/eneisoft-demo:${{ github.sha }}"
          kustomize edit set image eneisoft-demo="${IMAGE_TAG}"

      - name: Commit and push manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml

          # Si no hubo cambios, no falla
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en el tag de la imagen."
            exit 0
          fi

          git commit -m "gitops: deploy image ${{ github.sha }} [skip ci]"
          git push origin main

      - name: Generate GitOps Summary
        run: |
          echo "### 🔄 GitOps Triggered con éxito" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Se actualizó \`k8s/kustomization.yaml\` con el nuevo tag de imagen (\`${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`[skip ci]\` aplicado para evitar bucles de pipeline." >> "$GITHUB_STEP_SUMMARY"
          echo "- **Siguiente paso:** Argo CD detectará el commit en Git y reconciliará automáticamente el clúster AKS." >> "$GITHUB_STEP_SUMMARY"
