version: 2
updates:
  # Mantener dependencias de GitHub Actions al día
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 2

  # Mantener dependencias de Node.js / npm al día
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
