apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eneisoft-demo
  namespace: argocd
  labels:
    app.kubernetes.io/name: eneisoft-demo
    app.kubernetes.io/part-of: eneisoft-xvi-talk
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<TU_USUARIO>/eneisoft-pipeline-demo.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: eneisoft-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
